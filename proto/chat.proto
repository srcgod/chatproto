
syntax = "proto3";

package chat;


option go_package = "oneway/chat/v1;chatv1";


service ChatService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc GetChatsByUserID(GetChatByUserIDRequest) returns (GetChatsByUserIDResponse);
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);
}

message DeleteChatRequest {
  string chat_id = 1;
}

message UpdateChatRequest {
  string chat_id  = 1;
  optional string name = 2;
}

message UpdateChatResponse {
  Chat chat = 1;
}

message DeleteChatResponse {
  bool is_success = 1;
}

message CreateChatRequest {
  repeated int64 user_ids = 1;
  optional string name = 2;
}

message CreateChatResponse {
  string chat_id = 1;
  repeated int64 user_ids = 2;
}

message GetChatByUserIDRequest {
  int64 user_id = 1;
}
message GetChatsByUserIDResponse {
  repeated Chat chats = 1;
}

message Chat {
  repeated int64 user_ids = 1;
  string chat_id = 2;
  string name = 3;
}
